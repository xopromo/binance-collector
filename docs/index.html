<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Дашборд торговых стратегий</title>
  <meta name="description" content="Мониторинг торговых стратегий в реальном времени" />
  <meta name="theme-color" content="#0d1117" />

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ═══════════════════ HEADER ═══════════════════ -->
<header class="header">
  <div class="header-left">
    <a class="logo" href="#">
      <div class="logo-icon">📈</div>
      Дашборд стратегий
    </a>
  </div>

  <div class="header-right">
    <div class="status-badge">
      <div class="status-dot"></div>
      <span id="lastUpdated">Загрузка...</span>
    </div>
    <span id="refreshTimer" style="font-size:0.78rem;color:var(--text-muted)"></span>
    <button class="btn btn-sm" id="refreshBtn" title="Обновить данные">⟳ Обновить</button>
  </div>
</header>

<!-- ═══════════════════ MAIN ═══════════════════ -->
<main class="container">

  <!-- Strategy Tabs -->
  <div class="tabs-wrapper">
    <div class="tabs-label">Стратегия</div>
    <div class="tabs" id="strategyTabs">
      <button class="tab all active" data-id="all">
        <span class="tab-dot" style="background:linear-gradient(135deg,#bc8cff,#58a6ff)"></span>
        Все стратегии
      </button>
    </div>
  </div>

  <!-- ─── ALL STRATEGIES VIEW ─── -->
  <div id="allSignalsSection">

    <div class="section-title">Текущие сигналы</div>
    <div class="signals-grid" id="miniSignalsGrid">
      <div class="loading">
        <div class="spinner"></div>
        Загрузка стратегий...
      </div>
    </div>

  </div>

  <!-- ─── SINGLE STRATEGY VIEW ─── -->

  <!-- Signal Box -->
  <section id="signalSection" style="display:none;margin-bottom:20px">
    <div class="section-title">Текущий сигнал</div>
    <div id="signalBox" class="signal-box NO_SIGNAL">
      <div class="signal-icon">◆</div>
      <div class="signal-details">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
          <div class="signal-direction">NO_SIGNAL</div>
          <span class="confidence-badge LOW">LOW</span>
        </div>
        <div class="signal-reasoning">Ожидание данных...</div>
      </div>
    </div>
  </section>

  <!-- Stats -->
  <section id="statsSection" style="display:none;margin-bottom:20px">
    <div class="section-title">Статистика</div>
    <div class="grid-4" id="statsGrid">
      <!-- Generated by JS -->
    </div>
  </section>

  <!-- ─── PnL CHART (shown for both views) ─── -->
  <section style="margin-bottom:20px">
    <div class="card">
      <div class="card-header">
        <span class="section-title" style="margin-bottom:0">График PnL</span>
        <div id="chartControls" class="chart-controls" style="margin-bottom:0">
          <!-- Chart filter buttons could be added here -->
        </div>
      </div>
      <div class="chart-wrapper">
        <canvas id="pnlChart"></canvas>
      </div>
    </div>
  </section>

  <!-- Trade History -->
  <section id="historySection" style="display:none;margin-bottom:20px">
    <div class="card">
      <div class="card-header">
        <span class="section-title" style="margin-bottom:0">История сделок</span>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Дата</th>
              <th>Направление</th>
              <th>Вход</th>
              <th>Выход</th>
              <th>PnL%</th>
              <th>Причина выхода</th>
              <th>Символ</th>
            </tr>
          </thead>
          <tbody id="tradeTableBody">
            <tr>
              <td colspan="7">
                <div class="empty-state">
                  <div class="empty-state-icon">📋</div>
                  <div class="empty-state-text">Нет завершённых сделок</div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- Strategy Config -->
  <section id="configSection" style="display:none;margin-bottom:20px">
    <div class="card">
      <div class="card-header">
        <span class="section-title" style="margin-bottom:0">Конфигурация стратегии</span>
      </div>
      <div id="strategyConfig">
        <!-- Generated by JS -->
      </div>
    </div>
  </section>

</main>

<!-- ═══════════════════ TOAST CONTAINER ═══════════════════ -->
<div id="toast-container"></div>

<!-- ═══════════════════ REFRESH BAR ═══════════════════ -->
<div class="refresh-bar">
  <div class="refresh-progress" id="refreshProgress" style="width:0%"></div>
</div>

<!-- ═══════════════════ SCRIPTS ═══════════════════ -->
<script type="module" src="js/dashboard.js"></script>

</body>
</html>
